[package]
name = "codex-boot-animation-control-center"
version = "0.2.1"
description = "Control center for Codex Boot Animation"
authors = ["Codex Boot Animation contributors"]
edition = "2021"

[lib]
name = "codex_boot_animation_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = "2.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
