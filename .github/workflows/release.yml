name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tag and package versions
        run: |
          python3 - <<'PY'
          import json, os, pathlib, tomllib
          version = pathlib.Path("VERSION").read_text().strip()
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Tag must match VERSION"
          for file in ("control-center/package.json", "control-center/src-tauri/tauri.conf.json"):
              assert json.loads(pathlib.Path(file).read_text())["version"] == version, file
          assert tomllib.loads(pathlib.Path("control-center/src-tauri/Cargo.toml").read_text())["package"]["version"] == version
          PY

  windows:
    needs: version
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  macos:
    needs: version
    uses: ./.github/workflows/macos.yml
    permissions:
      contents: read

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: CodexBootAnimation-windows-x64
          path: release-files/windows
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: CodexBootAnimation-macos-arm64
          path: release-files/macos
      - name: Prepare verified release assets
        run: |
          python3 scripts/prepare-release.py release-files release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --title "Codex Boot Animation $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES.md
