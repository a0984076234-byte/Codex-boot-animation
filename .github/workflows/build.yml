name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build and run headless tests
        shell: powershell
        run: ./scripts/test.ps1
      - name: Package with bundled demo video
        shell: powershell
        run: ./scripts/package.ps1
      - name: Check repository and package
        shell: powershell
        run: ./scripts/verify-repository.ps1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Stage Windows native sidecar
        shell: powershell
        run: |
          $destination = Join-Path $PWD 'control-center/resources/windows/DragonCodexBoot'
          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item -Path (Join-Path $PWD 'build/DragonCodexBoot/*') -Destination $destination -Recurse -Force
      - name: Build Tauri control center
        working-directory: control-center
        shell: powershell
        run: |
          npm install
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml
          npm run tauri -- build --bundles nsis
          $version = (Get-Content ../VERSION -Raw).Trim()
          $portable = Join-Path $PWD "dist/CodexBootAnimation-$version-win-x64-control-center"
          New-Item -ItemType Directory -Path $portable -Force | Out-Null
          Copy-Item -LiteralPath 'src-tauri/target/release/codex-boot-animation-control-center.exe' -Destination $portable
          # Windows resource_dir is beside the executable, not a resources subfolder.
          New-Item -ItemType Directory -Path "$portable/native/windows","$portable/demo/media" -Force | Out-Null
          Copy-Item -LiteralPath 'resources/windows/DragonCodexBoot' -Destination "$portable/native/windows" -Recurse -Force
          Copy-Item -LiteralPath '../codex-theme.json' -Destination "$portable/demo"
          Copy-Item -Path '../media/*' -Destination "$portable/demo/media" -Force
          foreach ($name in @('LICENSE','THIRD_PARTY_NOTICES.md','VERSION')) {
            Copy-Item -LiteralPath "../$name" -Destination $portable
          }
          Copy-Item -LiteralPath '../docs/INSTALLATION.md' -Destination $portable
          foreach ($required in @('native/windows/DragonCodexBoot/DragonCodexBoot.exe','native/windows/DragonCodexBoot/scripts/integrate-entrypoints.ps1','demo/codex-theme.json','demo/media/startup.mp4')) {
            if (!(Test-Path -LiteralPath "$portable/$required")) { throw "Missing portable resource: $required" }
          }
          Compress-Archive -Path (Join-Path $portable '*') -DestinationPath ($portable + '.zip') -Force
          $check = Join-Path $env:RUNNER_TEMP 'control-center-unpacked'
          Expand-Archive -LiteralPath ($portable + '.zip') -DestinationPath $check -Force
          if ((Get-FileHash "$portable/demo/media/startup.mp4").Hash -ne (Get-FileHash "$check/demo/media/startup.mp4").Hash) { throw 'Portable media checksum mismatch' }
      - uses: actions/upload-artifact@v4
        with:
          name: CodexBootAnimation-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            control-center/dist/*-control-center.zip
            control-center/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
